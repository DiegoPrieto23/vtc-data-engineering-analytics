services:
  postgres:
    image: postgres:16
    container_name: vtc_postgres
    environment:
      POSTGRES_USER: ${PG_USER:?define PG_USER en el fichero .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?define PG_PASSWORD en el fichero .env}
      POSTGRES_DB: ${PG_DB:?define PG_DB en el fichero .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vtc_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:?define PG_USER en el fichero .env}
      PG_PASSWORD: ${PG_PASSWORD:?define PG_PASSWORD en el fichero .env}
      PG_DB: ${PG_DB:?define PG_DB en el fichero .env}
      PIPELINE_TARGET: ${PIPELINE_TARGET:-all}  # o 'drivers', 'trips', etc.
    volumes:
      - .:/app
    command: ["python", "-m", "src.main"]

  # Sirve el informe interactivo de report/ por HTTP.
  # Imprime en los logs la URL en la que está escuchando (http://localhost:${REPORT_PORT}).
  # No depende del pipeline: el informe lee el extracto JSON versionado en report/data/,
  # así que está disponible desde el primer segundo, aunque el ETL siga corriendo.
  report:
    build: .
    container_name: vtc_report
    environment:
      REPORT_PORT: ${REPORT_PORT:-8080}
    ports:
      - "${REPORT_PORT:-8080}:${REPORT_PORT:-8080}"
    volumes:
      - .:/app
    command: ["python", "scripts/serve_report.py"]
    restart: unless-stopped

volumes:
  postgres_data:
